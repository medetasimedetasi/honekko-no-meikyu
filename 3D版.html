<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ほねっこの迷宮 3D版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Sans+JP:wght@100&display=swap" rel="stylesheet">
<style>
/* 色はすべて共有32色 v2 から */
:root {
  --u: 2px;
  --ink: #fbf3e2; --ink-dim: #b8c4cc; --gold: #f0b84a;
  --paper: #f2dcb4; --paper-2: #e1bc88; --paper-ink: #3f2d21; --paper-dim: #8a5a38;
  --edge: #221b17; --slate: #2c3a48; --slate-2: #506573; --slate-3: #7a8e9c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b1120; color: var(--ink); overflow: hidden; }
body { display: grid; place-items: center; font-family: 'DotGothic16', 'MS Gothic', 'Osaka-Mono', monospace; }
button { font: inherit; color: inherit; cursor: pointer; }
#stage { position: relative; width: 960px; height: 540px; overflow: hidden; }
#view, #over { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
/* 瀕死のとき、画面の四隅に血のあと（不透明度30％。点滅させず、ゆっくり出てゆっくり消える） */
#blood { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; opacity: 0; transition: opacity .8s; }
#blood.on { opacity: .3; transition: opacity .3s; }
#blood.on.dim { opacity: .1; transition: opacity 2.5s; }
canvas.icon, canvas.px, #portrait { image-rendering: pixelated; image-rendering: crisp-edges; }

/* 左上：階（階段の札と数字）、その下にターンと得点 */
#hud-top { position: absolute; left: calc(var(--u) * 10); top: calc(var(--u) * 9); pointer-events: none; text-shadow: 0 calc(var(--u) * 1) 0 #000; }
.floor-row { display: flex; align-items: center; gap: calc(var(--u) * 7); }
.floor-ic { width: calc(var(--u) * 22); height: calc(var(--u) * 22); background: var(--slate); border: calc(var(--u) * 1) solid var(--edge); box-shadow: inset 0 0 0 calc(var(--u) * 1) var(--slate-2); display: grid; place-items: center; }
.floor-ic canvas { width: calc(var(--u) * 14); height: calc(var(--u) * 14); }
#floor { line-height: 1; }
/* 階・ターン・スコアの下地：乗算で少し暗くして読みやすく（2026-10-09 テストプレイ）。角は3ドット落とす */
#hud-shade { position: absolute; left: calc(var(--u) * 4); top: calc(var(--u) * 4); width: calc(var(--u) * 80); height: calc(var(--u) * 62); pointer-events: none;
  background: #506573; mix-blend-mode: multiply;
  clip-path: polygon(calc(var(--u) * 3) 0, calc(100% - var(--u) * 3) 0, 100% calc(var(--u) * 3), 100% calc(100% - var(--u) * 3), calc(100% - var(--u) * 3) 100%, calc(var(--u) * 3) 100%, 0 calc(100% - var(--u) * 3), 0 calc(var(--u) * 3)); }
.stat-row { display: flex; align-items: center; gap: calc(var(--u) * 5); margin-top: calc(var(--u) * 7); line-height: 1; }
.stat-row + .stat-row { margin-top: calc(var(--u) * 5); }
.stat-row canvas { width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
.stat-row .lab { width: calc(var(--u) * 26); color: var(--ink-dim); margin-left: calc(var(--u) * 2); }   /* 左に「ターン」「スコア」（2026-10-09） */

/* 左：直近のできごと（枠で囲まず、文字だけで流れて消える） */
#log { position: absolute; left: calc(var(--u) * 12); top: calc(var(--u) * 82); width: calc(var(--u) * 116); display: flex; flex-direction: column; gap: calc(var(--u) * 3); pointer-events: none; }
#log div { line-height: 1.3; color: var(--ink-dim); transition: opacity .6s, transform .2s; }
#log div.new { opacity: 0; transform: translateY(calc(var(--u) * 3)); }
#log div.old { opacity: 0; }

/* 左端：ログの収納タブ（押すと、これまでのできごとを読める） */
#log-tab {
  position: absolute; left: 0; top: calc(var(--u) * 76); width: calc(var(--u) * 9); height: calc(var(--u) * 30); padding: 0;
  background: var(--slate); border: calc(var(--u) * 1) solid var(--edge); border-left: 0; box-shadow: inset calc(var(--u) * -1) 0 0 var(--slate-2);
  display: grid; place-items: center; z-index: 7;
}
#log-tab i { display: block; width: calc(var(--u) * 4); height: calc(var(--u) * 14); background:
  linear-gradient(var(--ink-dim) 0 0) 0 0 / 100% calc(var(--u) * 1) no-repeat, linear-gradient(var(--ink-dim) 0 0) 0 calc(var(--u) * 4) / 70% calc(var(--u) * 1) no-repeat,
  linear-gradient(var(--ink-dim) 0 0) 0 calc(var(--u) * 8) / 100% calc(var(--u) * 1) no-repeat, linear-gradient(var(--ink-dim) 0 0) 0 calc(var(--u) * 12) / 55% calc(var(--u) * 1) no-repeat; }
#log-tab:hover i, #log-tab.open i { filter: brightness(1.4); }
#log-tab.open { left: calc(var(--u) * 122); }
#log-panel {
  position: absolute; left: 0; top: calc(var(--u) * 64); width: calc(var(--u) * 122); height: calc(var(--u) * 128); display: none; z-index: 7;
  background: #0b1120ee; border: calc(var(--u) * 1) solid var(--edge); border-left: 0; box-shadow: inset calc(var(--u) * -1) 0 0 var(--slate-2);
  padding: calc(var(--u) * 5) calc(var(--u) * 6); overflow-y: auto; font-size: calc(var(--u) * 5.6); line-height: 1.45; color: var(--ink-dim);
}
#log-panel.open { display: block; }
#log-panel .fl { color: var(--gold); margin: calc(var(--u) * 3) 0 calc(var(--u) * 1); }
#log-panel .ln span { color: #6e655a; margin-right: calc(var(--u) * 3); }
#log-panel .empty { color: #6e655a; }
body.log-open #log { opacity: 0; }

/* 右上：メニュー */
#menu-btn {
  position: absolute; right: calc(var(--u) * 10); top: calc(var(--u) * 9); width: calc(var(--u) * 22); height: calc(var(--u) * 22);
  background: var(--slate); border: calc(var(--u) * 1) solid var(--edge); box-shadow: inset 0 0 0 calc(var(--u) * 1) var(--slate-2);
  display: grid; place-items: center; padding: 0;
}
#menu-btn i, #menu-btn i::before, #menu-btn i::after { display: block; width: calc(var(--u) * 10); height: calc(var(--u) * 2); background: var(--ink-dim); position: relative; }
#menu-btn i::before, #menu-btn i::after { content: ''; position: absolute; left: 0; }
#menu-btn i::before { top: calc(var(--u) * -4); } #menu-btn i::after { top: calc(var(--u) * 4); }
#menu-btn:hover i, #menu-btn:hover i::before, #menu-btn:hover i::after { background: var(--ink); }

/* 左下：顔 */
/* 顔グラ（96×96ドット・背景透過）を枠なしで等倍に置く。胸元の切れ目（絵の下3ドットは透明）を画面の下端にそろえる。動きは js/face_anim.js */
#hud-me { position: absolute; left: calc(var(--u) * 4); bottom: calc(var(--u) * -3); pointer-events: none; }
.face { width: calc(var(--u) * 96); height: calc(var(--u) * 96); }
#portrait { width: 100%; height: 100%; display: block; }

/* 上辺の真ん中：体力と防御（原作に近い並べ方。盤と同じ幅の長い棒、その下に効果） */
#status { position: absolute; left: 50%; top: calc(var(--u) * 2); width: calc(var(--u) * 192); transform: translateX(-50%); pointer-events: none; text-shadow: 0 calc(var(--u) * 1) 0 #000; }
.st-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; min-height: calc(var(--u) * 8); }
.st-row .hp-lab { justify-self: start; }
.st-row .blk { justify-self: center; }
.blk b { color: var(--ink-dim); }
.hp-lab { line-height: 1; color: var(--ink); }
.hp-lab b { color: var(--ink-dim); margin-right: calc(var(--u) * 3); }
.bar { width: 100%; height: calc(var(--u) * 7); margin-top: calc(var(--u) * 1); background: #221b17; border: calc(var(--u) * 1) solid #0b1120; position: relative; box-shadow: inset 0 0 0 calc(var(--u) * 1) #4a4640; }
/* ダメージを受けたとき：棒を小刻みに揺さぶる（点滅はさせない）。減っていく先から粒が飛ぶ（#hp-fx） */
.bar.hit { animation: barhit .3s linear; }
@keyframes barhit {
  0% { transform: translate(0, 0); } 12% { transform: translate(calc(var(--u) * -2), calc(var(--u) * 1)); } 25% { transform: translate(calc(var(--u) * 2), calc(var(--u) * -1)); }
  40% { transform: translate(calc(var(--u) * -1), calc(var(--u) * 1)); } 55% { transform: translate(calc(var(--u) * 1), 0); } 75% { transform: translate(calc(var(--u) * -1), 0); } 100% { transform: translate(0, 0); }
}
#hp-fx { position: absolute; left: calc(var(--u) * -20); top: calc(var(--u) * -20); width: calc(var(--u) * 232); height: calc(var(--u) * 64); image-rendering: pixelated; pointer-events: none; }
#hp-bar { position: absolute; inset: calc(var(--u) * 1) auto calc(var(--u) * 1) calc(var(--u) * 1); max-width: calc(100% - var(--u) * 2); background: #d24a3c; box-shadow: inset 0 calc(var(--u) * 1) 0 #e7a08a; transition: width .25s steps(6); }
.blk { display: flex; align-items: center; gap: calc(var(--u) * 3); line-height: 1; color: var(--ink-dim); }
.blk canvas { width: calc(var(--u) * 7); height: calc(var(--u) * 8); opacity: .6; }
.blk.on { color: var(--ink); } .blk.on canvas { opacity: 1; }
#effects { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 2); }
#effects span { font-size: calc(var(--u) * 5.5); color: #f0b84a; border: calc(var(--u) * 1) solid #5c422c; padding: 0 calc(var(--u) * 2); background: #221b17e6; }

/* 画面中央のひとこと（「そっちには進めない」など）。文字は書体本来の大きさで描いてから整数倍に拡大して、ドットをくっきり出す。
   点滅させず、すっと出てゆっくり消える */
@font-face { font-family: 'MaruMonica'; src: url('fonts/x12y16pxMaruMonica.ttf'); }
#say { position: absolute; left: 50%; top: calc(var(--u) * 88); transform: translate(-50%, -50%); z-index: 5; pointer-events: none; image-rendering: pixelated; opacity: 0; transition: opacity .35s; }
#say.show { opacity: .88; transition: opacity .08s; }     /* ほんの少し透かして、画面になじませる */
/* 文字の下の影（乗算で下の床を暗くする） */
#say-shadow { position: absolute; left: 50%; top: calc(var(--u) * 88); transform: translate(-50%, -50%); z-index: 5; pointer-events: none; mix-blend-mode: multiply; opacity: 0; transition: opacity .35s; }
#say-shadow.show { opacity: 1; transition: opacity .08s; }
/* 画面の文字（マルモニカ・黒縁取り・少し透かす）。ドット書体なので、大きさは fit() で書体本来の 16px の整数倍にそろえ（--fs-*）、
   縁取りは書体の1ドットぶんの太さ（--o-*）で8方向に引く。ダメージの数字と、紙の上の小さな文字はそのまま */
.mm { font-family: 'MaruMonica', 'DotGothic16', monospace; font-weight: normal; line-height: 1; opacity: .9; letter-spacing: 0;
  text-shadow: calc(var(--o) * -1) calc(var(--o) * -1) 0 #0b1120, 0 calc(var(--o) * -1) 0 #0b1120, var(--o) calc(var(--o) * -1) 0 #0b1120, calc(var(--o) * -1) 0 0 #0b1120,
    var(--o) 0 0 #0b1120, calc(var(--o) * -1) var(--o) 0 #0b1120, 0 var(--o) 0 #0b1120, var(--o) var(--o) 0 #0b1120; }
.mm.h { font-size: var(--fs-h); --o: var(--o-h); } .mm.xl { font-size: var(--fs-xl); --o: var(--o-xl); } .mm.t { font-size: var(--fs-t); --o: var(--o-t); }
.mm.g { font-size: var(--fs-g); --o: var(--o-g); } .mm.w { font-size: var(--fs-w); --o: var(--o-w); } .mm.b { font-size: var(--fs-b); --o: var(--o-b); } .mm.l { font-size: var(--fs-l); --o: var(--o-l); } .mm.m { font-size: var(--fs-m); --o: var(--o-m); } .mm.s { font-size: var(--fs-s); --o: var(--o-s); line-height: 1.3; }
/* 書体くらべ（T キー） */
#fontcmp { position: absolute; left: 50%; top: calc(var(--u) * 40); transform: translateX(-50%); width: calc(var(--u) * 230); display: none; z-index: 9;
  background: #0b1120e6; border: calc(var(--u) * 1) solid var(--edge); box-shadow: inset 0 0 0 calc(var(--u) * 1) var(--slate-2); padding: calc(var(--u) * 5); }
#fontcmp.open { display: block; }
#fontcmp .h { font-size: calc(var(--u) * 5.5); color: var(--ink-dim); margin-bottom: calc(var(--u) * 4); }
#fontcmp button { display: grid; grid-template-columns: calc(var(--u) * 62) 1fr; align-items: center; width: 100%; padding: calc(var(--u) * 3) calc(var(--u) * 4); margin-bottom: calc(var(--u) * 2);
  background: #18222d; border: calc(var(--u) * 1) solid #2c3a48; text-align: left; font-size: calc(var(--u) * 5.5); color: var(--ink-dim); }
#fontcmp button.on { border-color: var(--gold); color: var(--ink); }
#fontcmp canvas { image-rendering: pixelated; justify-self: center; }

/* 右下：山札と捨て札（札の束） */
#piles { position: absolute; right: calc(var(--u) * 8); top: calc(var(--u) * 38); display: flex; gap: calc(var(--u) * 8); align-items: flex-end; }   /* 「もちもの一覧」の下（2026-10-09。前は右下）。枚数はカードの上に重ねて低くした（下の説明の窓と重ならないよう） */
.pile { position: relative; width: calc(var(--u) * 36); text-align: center; }
.stack { position: relative; height: calc(var(--u) * 48); }
.stack i { position: absolute; left: 0; width: calc(var(--u) * 33); height: calc(var(--u) * 45); border: calc(var(--u) * 1) solid var(--edge); }
#deck .stack i { background: #425c8d var(--back-pile) 0 0 / 100% 100% no-repeat border-box; image-rendering: pixelated; }
#deck .stack i:nth-child(1) { top: calc(var(--u) * 3); left: calc(var(--u) * 3); }
#deck .stack i:nth-child(2) { top: calc(var(--u) * 1.5); left: calc(var(--u) * 1.5); }
#deck .stack i:nth-child(3) { top: 0; }
#disc .stack i { background: var(--paper); box-shadow: inset 0 0 0 calc(var(--u) * 1) #fbf3e2; }
#disc .stack i:nth-child(1) { top: calc(var(--u) * 3); left: calc(var(--u) * 3); background: var(--paper-2); }
#disc .stack i:nth-child(2) { top: 0; }
#disc-face { position: absolute; left: calc(var(--u) * 1); top: calc(var(--u) * 7); width: calc(var(--u) * 32); display: grid; place-items: center; }
#disc-face canvas { width: calc(var(--u) * 27); height: calc(var(--u) * 27); display: block; }
.pile.empty .stack i { opacity: .25; }
.pile.empty #disc-face { display: none; }
.pile b { position: absolute; left: 0; top: calc(var(--u) * 33); width: calc(var(--u) * 33); text-align: center; line-height: 1; z-index: 1; color: #fbf3e2;
  text-shadow: calc(var(--u) * .5) 0 0 #221b17, calc(var(--u) * -.5) 0 0 #221b17, 0 calc(var(--u) * .5) 0 #221b17, 0 calc(var(--u) * -.5) 0 #221b17; }
.pile.small b { top: calc(var(--u) * 19); width: calc(var(--u) * 21); }
.pile small { display: block; margin-top: calc(var(--u) * 1); color: var(--ink-dim); white-space: nowrap; }
/* 除外の束（小さめ。灰色に焼けたカード）。押すと除外したカードの一覧 */
.pile.small { width: calc(var(--u) * 24); cursor: pointer; }
.pile.small .stack { height: calc(var(--u) * 33); }
.pile.small .stack i { width: calc(var(--u) * 21); height: calc(var(--u) * 30); background: #4a4640; box-shadow: inset 0 0 0 calc(var(--u) * 1) #6e655a, inset 0 calc(var(--u) * -6) 0 #221b17aa; }
.pile.small .stack i:nth-child(1) { top: calc(var(--u) * 2); left: calc(var(--u) * 2); background: #2c3a48; }
.pile.small .stack i:nth-child(2) { top: 0; }
.pile.small:hover .stack i:nth-child(2) { box-shadow: inset 0 0 0 calc(var(--u) * 1) #a19077, inset 0 calc(var(--u) * -6) 0 #221b17aa; }

/* 手札：盤の手前に半分しまってある。色の帯・大きな絵・値の点 */
.card {
  position: absolute; width: calc(var(--u) * 42); height: calc(var(--u) * 60); padding: 0;
  background: var(--paper); color: var(--paper-ink); border: calc(var(--u) * 1) solid var(--edge);
  box-shadow: inset 0 0 0 calc(var(--u) * 1) #fbf3e2, 0 calc(var(--u) * 2) 0 #0009;
  display: flex; flex-direction: column; align-items: center;
  transition: transform .09s steps(3), opacity .15s, translate .14s ease-out;
}
.card .band { position: relative; width: 100%; height: calc(var(--u) * 9); background: var(--kc, #6e655a); border-bottom: calc(var(--u) * 1) solid var(--edge); box-shadow: inset 0 calc(var(--u) * 1) 0 #fbf3e255, inset 0 calc(var(--u) * -2) 0 #0003;
  display: flex; align-items: center; justify-content: center; }
/* 色帯の字：効果といまの数値（白に濃い縁）。鍵は右端 */
.card .band .eff { font-weight: normal; line-height: 1; color: #fbf3e2; white-space: nowrap;
  text-shadow: calc(var(--u) * .5) 0 0 #221b17, calc(var(--u) * -.5) 0 0 #221b17, 0 calc(var(--u) * .5) 0 #221b17, 0 calc(var(--u) * -.5) 0 #221b17; }
.card .band .lock { position: absolute; right: calc(var(--u) * 2); top: calc(var(--u) * .5); width: calc(var(--u) * 7); height: calc(var(--u) * 8); background: var(--lock) 0 0 / 100% 100%; image-rendering: pixelated; }
.card .art { position: relative; display: block; width: calc(var(--u) * 36); height: calc(var(--u) * 36); margin: 0 0 calc(var(--u) * 1); }
.card .icon { width: calc(var(--u) * 36); height: calc(var(--u) * 36); display: block; }   /* 絵は18×18（外周の黒を含む）を2倍 */
/* 合成の段（＋2 など）：絵の右下（手札をしまっていても、両端のカードでぎりぎり見える高さ）に、太いドットの数字（黒・白の縁）を1倍・不透明度80％で（大きさは game3d.js の plusImage が付ける） */
.card .art .plus { position: absolute; right: calc(var(--u) * -2); top: calc(var(--u) * 18); image-rendering: pixelated; display: block; opacity: .8; }
/* 絵の下：カードの名前（黒の字、ドットの縁取りなし） */
.card .nm { display: block; width: 100%; text-align: center; white-space: nowrap; line-height: 1; color: #221b17; opacity: 1; text-shadow: none; }   /* 黒・縁なし（2026-10-09） */
.card .pips { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 1); width: calc(var(--u) * 30); min-height: calc(var(--u) * 8); }
.card .pips i { width: calc(var(--u) * 3); height: calc(var(--u) * 3); background: var(--paper-ink); }
.card .pips b { font-weight: normal; font-size: calc(var(--u) * 7); line-height: 1; }
.card .key { position: absolute; right: calc(var(--u) * 3); bottom: calc(var(--u) * 3); font-size: calc(var(--u) * 5); color: #3f2d2155; }
/* 扇形に持つ：カードごとの傾き（--rot）。手をかざすと、その傾きの向きのまま持ち上がる */
.card { transform: rotate(var(--rot, 0deg)); transform-origin: 50% 85%; }
.card:hover { transform: rotate(var(--rot, 0deg)) translateY(calc(var(--u) * -20)); z-index: 2; }
.card.sel { transform: rotate(var(--rot, 0deg)) translateY(calc(var(--u) * -12)); outline: calc(var(--u) * 1) solid var(--gold); z-index: 1; }
.card.sel:hover { transform: rotate(var(--rot, 0deg)) translateY(calc(var(--u) * -20)); }
.card.leaving { opacity: 0; transform: rotate(var(--rot, 0deg)) translateY(calc(var(--u) * -30)); }
.k-move { --kc: #5c7236; } .k-atk { --kc: #8f2f2b; } .k-def { --kc: #425c8d; }
.k-food { --kc: #cca673; } .k-potion { --kc: #d24a3c; } .k-treasure { --kc: #f0b84a; }
.k-scroll { --kc: #6e655a; } .k-charm { --kc: #ae6f47; } .k-misc { --kc: #506573; }

/* 行き先の演出：ゲームの解像度で描いたカード（.cardfx）と、粒の層（#card-fx） */
.cardfx { position: absolute; image-rendering: pixelated; pointer-events: none; z-index: 5; transform-origin: 50% 50%; }
/* カードを使って変わった数値（防御＋4 など）。演出のカードのすぐ右に、縦に並べる */
.card-gain { position: absolute; z-index: 6; pointer-events: none; display: flex; flex-direction: column; gap: calc(var(--u) * 2); white-space: nowrap; }
.card-gain b { font-weight: normal; }
